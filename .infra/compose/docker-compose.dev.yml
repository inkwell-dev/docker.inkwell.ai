name: inkwell

services:
  # ── Reverse Proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    # Published twice, on purpose:
    #
    #   127.0.0.2:80   — the named hosts (frontend/backend/storage.inkwell.ai).
    #                    Port 80 on 127.0.0.1 is taken by ddev-router whenever a
    #                    ddev project runs; every address in 127.0.0.0/8 is
    #                    loopback on Linux, so .2 sidesteps it with no conflict.
    #   127.0.0.1:8080 — the original origin, kept alive because Google OAuth
    #                    only accepts http:// redirect URIs on `localhost`, and
    #                    the frontend's `pnpm api:codegen` hardcodes this URL.
    ports:
      - "${NGINX_BIND_IP:-127.0.0.2}:${NGINX_PORT:-80}:80"
      - "127.0.0.1:${NGINX_HOST_PORT:-8080}:80"
    volumes:
      # dev.conf, not default.conf — production mounts default.conf, and this
      # config defers upstream DNS so nginx can boot without the app services.
      - ../nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    # No depends_on: web/api sit behind the "apps" profile and are normally not
    # running when nginx starts. dev.conf resolves them lazily, so a stopped
    # service is a 502 rather than a proxy that refuses to boot.
    restart: unless-stopped
    networks:
      inkwell:
        # Makes the three dev hostnames resolve *inside* the compose network as
        # well, not only via the host's /etc/hosts. Without this the api
        # container could not presign against storage.inkwell.ai, and any
        # container-side curl to backend.inkwell.ai would fail DNS.
        aliases:
          - frontend.inkwell.ai
          - backend.inkwell.ai
          - storage.inkwell.ai

  # ── Frontend (hot reload) ─────────────────────────────────────────────────
  web:
    build:
      context: ../../src/frontend.inkwell.ai
      # Relative to the context, hence the ../.. back out of src/<repo>.
      dockerfile: ../../.infra/dockerfiles/web.dev.dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /app
    # Behind a profile so `make dciup-dev` brings up infrastructure only and this
    # service does NOT auto-start. Run it in its own terminal with `make dci-web`
    # (or start everything at once with `make dciup-all`).
    #
    # Previously it started automatically, which is why shelling in and running
    # `pnpm dev` by hand reported "Another next dev server is already running".
    profiles: ["apps"]
    # See the note on the api service — this container writes .next/ into the
    # bind-mounted repo, so it must not run as root.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Just the dev server. The install is a cached image layer now (see
    # .infra/dockerfiles/web.dev.dockerfile) instead of running on every start.
    # Dependency changed? `make dci-dev-build`.
    command: pnpm dev
    volumes:
      - ../../src/frontend.inkwell.ai:/app
      - web_node_modules:/app/node_modules
    environment:
      # Browser-facing. Baked into the client bundle, so it must be an address
      # the *browser* can reach — never a container name.
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://frontend.inkwell.ai/api}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://frontend.inkwell.ai}
      # Gates the Google sign-in button. Defaults OFF: GoogleStrategy falls back
      # to the client id 'not-configured' rather than failing at boot, so with no
      # credentials the button would render and dead-end the user on Google's own
      # error page. Set to 'true' once GOOGLE_CLIENT_ID/SECRET hold real values.
      - NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
      # Server-side only: the three generateMetadata() calls in
      # src/lib/api/server-fetch.ts run inside this container, where the public
      # hostname is reachable but the direct container name is one hop shorter
      # and does not depend on nginx being healthy. Previously this was set only
      # in the frontend repo's .env.local, and when it was missing those fetches
      # failed *silently* — page titles quietly degraded to raw slugs.
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://api:3000/api}
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      # Corepack defaults its home to $HOME, which is unwritable once we drop
      # from root.
      - COREPACK_HOME=/tmp/corepack
    # No depends_on: api — the frontend talks to the API over HTTP at request
    # time, not at boot. Keeping the dependency would make `make dci-web` also
    # start the API in the background, which is exactly the coupling this split
    # is meant to remove.
    networks:
      - inkwell

  # ── Schema migrations (one-shot) ──────────────────────────────────────────
  #
  # Runs to completion and exits; `api` and `worker` are gated on it succeeding.
  #
  # ## Why this had to exist in dev too
  #
  # It did not, and that is the whole of the `relation "article_tags" does not
  # exist` bug. The schema and the generated migrations were never out of sync —
  # 24 tables on both sides — but nothing in the DEV path ever applied them:
  # this file had no migrate service, `api` had no dependency to gate on, the
  # Makefile had no target, and the README's onboarding went straight from
  # `make dci-dev-build` to `make dci-api`. Production had all four (see
  # docker-compose.production.yml) so the gap was invisible from the deploy
  # side. A fresh clone therefore booted the API against an EMPTY database and
  # failed on the first query that touched a table nobody had created.
  #
  # ## Why a separate service and not a step in the API's bootstrap
  #
  # So there is exactly one writer applying DDL. Two replicas racing on the same
  # migration is a lock contest whose loser boots against a half-migrated
  # schema. Same reasoning as production, and it is written out at length in
  # backend.inkwell.ai/src/database/migrate.ts.
  #
  # ## Why the same runner as production rather than `drizzle-kit migrate`
  #
  # drizzle-kit is available here (it is a devDependency and dev images keep
  # them), so it would have worked — and it would have made dev the one
  # environment applying migrations by a different mechanism than the one being
  # shipped. `db:migrate` runs `dist/src/database/migrate.js`, byte-identical to
  # what the deploy runs, which also picks up the `CREATE EXTENSION vector` that
  # drizzle-kit never emits and the baseline migration cannot do without.
  #
  # The `nest build` in that script costs ~40s on a cold tree and seconds
  # afterwards (tsconfig sets `incremental: true`).
  #
  # ## Why it is in the "apps" profile
  #
  # `make dciup-dev` stays what it says it is — infrastructure only — and does
  # not acquire a dependency on a built application image. Naming `api` on the
  # command line enables the profile, so `make dci-api` still pulls this in and
  # waits for it.
  #
  # `restart: "no"` is explicit and load-bearing wherever a restart policy could
  # be inherited: a clean exit 0 must not read as a crash worth restarting.
  migrate:
    image: inkwell-api:dev
    build:
      context: ../../src/backend.inkwell.ai
      dockerfile: ../../.infra/dockerfiles/api.dev.dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /app
    profiles: ["apps"]
    # Shares the backend bind mount and the api's node_modules volume, so it
    # must run as the same non-root user — it writes dist/ into the developer's
    # working tree exactly as the api container does (see the note there).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: pnpm db:migrate
    volumes:
      - ../../src/backend.inkwell.ai:/app
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - COREPACK_HOME=/tmp/corepack
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - inkwell

  # ── Backend API (hot reload) ──────────────────────────────────────────────
  api:
    image: inkwell-api:dev
    build:
      context: ../../src/backend.inkwell.ai
      # Relative to the context, hence the ../.. back out of src/<repo>.
      dockerfile: ../../.infra/dockerfiles/api.dev.dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /app
    # Behind a profile — see the note on `web`. Run with `make dci-api`.
    profiles: ["apps"]
    # Run as the host user, not root.
    #
    # This container bind-mounts the backend repo and compiles into it, so as
    # root it created dist/ owned by root:root inside the developer's working
    # tree. Because tsconfig sets `incremental: true`, that made even
    # `tsc --noEmit` fail EACCES on the host — it still wants to write
    # dist/tsconfig.buildinfo — and `pnpm build` / `pnpm test` failed outright.
    # Deleting the directory only helped until the next container start.
    #
    # Override per-machine with DOCKER_UID/DOCKER_GID in .env if your host user
    # is not 1000:1000 (`id -u` / `id -g`).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Install is a cached image layer now — see .infra/dockerfiles/api.dev.dockerfile.
    command: pnpm start:dev
    volumes:
      - ../../src/backend.inkwell.ai:/app
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Corepack defaults its home to $HOME, unwritable once we drop from root.
      - COREPACK_HOME=/tmp/corepack
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Was never passed through at all, so the strategy fell back to
      # http://localhost:3000/... — a port this stack never publishes, which
      # meant the Google sign-in round trip could not complete.
      # Must stay on `localhost`: Google rejects http:// redirect URIs for any
      # other hostname, which is why nginx keeps its 127.0.0.1:8080 publish.
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      # storage.inkwell.ai, not minio:9000. These two values are what the
      # presigned PUT URL handed to the browser is built from, and no browser can
      # resolve a container name — uploads failed at the network layer before
      # this. Port 80 because the request now goes through nginx.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-storage.inkwell.ai}
      - MINIO_PORT=${MINIO_PORT:-80}
      # Plain HTTP locally — nginx terminates nothing here. Production sets this
      # to true so presigned URLs carry https://.
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-inkwell}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Two roles: LLM fallback, and ALL RAG embeddings
      # (gemini-embedding-001 @ 1536 dims). Chat and inline editing use Groq.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Photographs for `pnpm db:seed` only — nothing in the running
      # application reads it. Optional: with no key the seeder falls back to
      # generated placeholder art rather than failing, so `make dci-seed` works
      # on a machine that has never configured one.
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      # Error reporting. Optional: with no DSN the SDK no-ops. This one IS
      # runtime config, unlike the frontend's NEXT_PUBLIC_SENTRY_DSN, which is
      # baked into the browser bundle at build time and must be a build arg.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.inkwell.ai}
      # Extra allowed origins beyond FRONTEND_URL. The legacy localhost origin
      # stays on the list so the OAuth callback and Swagger's "Try it out" keep
      # working from http://localhost:8080.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for the one-shot migration to exit 0. Without this the service
      # starts against whatever schema happens to be there, which is how an
      # empty database became a runtime error instead of a startup failure.
      migrate:
        condition: service_completed_successfully
    networks:
      - inkwell

  # ── Background Worker (hot reload) ────────────────────────────────────────
  worker:
    image: inkwell-api:dev
    build:
      context: ../../src/backend.inkwell.ai
      # Relative to the context, hence the ../.. back out of src/<repo>.
      dockerfile: ../../.infra/dockerfiles/api.dev.dockerfile
      target: development
      args:
        UID: ${DOCKER_UID:-1000}
        GID: ${DOCKER_GID:-1000}
    working_dir: /app
    # Behind a profile — see the note on `web`. Run with `make dci-worker`.
    profiles: ["apps"]
    # Shares the backend bind mount and the api's node_modules volume, so it
    # must run as the same non-root user for the same reason (see api).
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # `start:worker:dev`, not `start:dev -- --entryFile worker`. The `--` handed
    # the flag to the compiled app instead of to the nest CLI, so this container
    # silently booted dist/src/main — a second copy of the API, with no BullMQ
    # worker at all. Every scheduled job (token reset, analytics aggregation)
    # therefore had no consumer. The dedicated script removes the ambiguity.
    command: pnpm start:worker:dev
    volumes:
      - ../../src/backend.inkwell.ai:/app
      - api_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - COREPACK_HOME=/tmp/corepack
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      # Same values as the api service — the worker shares the codebase, so the
      # MinIO client is constructed identically.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-storage.inkwell.ai}
      - MINIO_PORT=${MINIO_PORT:-80}
      # Plain HTTP locally — nginx terminates nothing here. Production sets this
      # to true so presigned URLs carry https://.
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET=${MINIO_BUCKET:-inkwell}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Two roles: LLM fallback, and ALL RAG embeddings
      # (gemini-embedding-001 @ 1536 dims). Chat and inline editing use Groq.
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Error reporting. Optional: with no DSN the SDK no-ops. This one IS
      # runtime config, unlike the frontend's NEXT_PUBLIC_SENTRY_DSN, which is
      # baked into the browser bundle at build time and must be a build arg.
      - SENTRY_DSN=${SENTRY_DSN:-}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://frontend.inkwell.ai}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Waits for the one-shot migration to exit 0. Without this the service
      # starts against whatever schema happens to be there, which is how an
      # empty database became a runtime error instead of a startup failure.
      migrate:
        condition: service_completed_successfully
    networks:
      - inkwell

  # ── Database ──────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-inkwell}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-inkwell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only. A bare "5433:5432" publishes on every interface, which puts
    # the database on whatever network the laptop is joined to. Nothing outside
    # this machine needs it: the app services reach it over the compose network
    # by service name, and this publish exists purely for psql/a GUI client.
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inkwell} -d ${POSTGRES_DB:-inkwell}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inkwell

  # ── Cache + Queue ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-inkwell_redis}
    volumes:
      - redis_data:/data
    # Loopback only — see the note on db. redis-cli from the host still works.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-inkwell_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - inkwell

  # ── Object Storage ────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-inkwell}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # Loopback only — see the note on db. Browser access to uploaded objects does
    # not come through here; it goes through nginx, which proxies /storage/ and
    # the storage.inkwell.ai vhost over the compose network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - inkwell

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
  api_node_modules:

networks:
  inkwell:
    driver: bridge
