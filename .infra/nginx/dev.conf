# Development reverse proxy.
#
# Deliberately a SEPARATE file from default.conf: the production compose file
# mounts default.conf too, so editing it would change production behaviour as a
# side effect of a dev-only workflow change.
#
# Two things make this file different from the production one:
#
#   1. Upstreams are resolved per request, not at config load (see below).
#   2. It serves three vhosts instead of one.

# Docker's embedded DNS server. Every container on a user-defined network can
# reach it at this fixed address.
#
# WHY THIS LINE EXISTS: an `upstream web { server web:3000; }` block is resolved
# once, when nginx parses the config. In this dev setup web/api/worker sit behind
# a compose profile and are usually NOT running when nginx boots, so that lookup
# fails and nginx exits with "host not found in upstream" — the proxy would be
# unusable until every app service happened to be up first.
#
# Naming the upstream through a *variable* in proxy_pass forces nginx to defer
# the lookup to request time, using this resolver. A stopped service then yields
# a clean 502 instead of a dead proxy, and starting it later just works.
resolver 127.0.0.11 valid=10s ipv6=off;

# ── vhost 1: the app — http://frontend.inkwell.ai ────────────────────────────
#
# Also the default_server, so http://localhost:8080 and http://127.0.0.2 keep
# working unchanged. Single-origin on purpose: /api and /storage are served from
# the same host as the pages, which is exactly how production behaves, and keeps
# the relative /storage/<bucket>/<key> URLs already persisted in the database
# valid.
server {
    listen 80 default_server;
    server_name frontend.inkwell.ai localhost 127.0.0.1;

    # API routes — the backend already sets a global /api prefix, so the path is
    # forwarded verbatim with no rewrite.
    location /api/ {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;
        # A recorded prompt for /api/ai/transcribe is multipart audio; nginx's
        # default cap is 1m, which rejects anything past about a minute of Opus
        # with its own HTML 413 before the API ever sees it. 12m sits just above
        # the API's own 10 MB cap, so the sentence the writer reads on an
        # over-long recording is the API's, not nginx's.
        client_max_body_size 12m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (streaming AI responses + the notifications feed).
        # Clearing Connection keeps the upstream connection open; buffering must
        # be off or nginx holds events until its buffer fills.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # AI generation streams can run well past the 60s default.
        proxy_read_timeout 300s;
    }

    # MinIO object storage — serves uploaded images under a same-origin path.
    #
    # The rewrite strips the /storage/ prefix. In the production config that is
    # done by the trailing slash in `proxy_pass http://minio:9000/;`, but a
    # proxy_pass carrying a variable may not also carry a URI part, so the strip
    # has to be explicit here.
    #
    # `set` MUST come before `rewrite`: both are rewrite-phase directives, and
    # `rewrite ... break` ends that phase — a `set` placed after it never runs,
    # leaving the variable empty and every request failing with nginx 500
    # ("invalid URL prefix in http://").
    location /storage/ {
        set $upstream_minio minio:9000;
        rewrite ^/storage/(.*)$ /$1 break;

        proxy_pass http://$upstream_minio;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
    }

    # Everything else → Next.js.
    location / {
        set $upstream_web web:3000;
        proxy_pass http://$upstream_web;

        proxy_http_version 1.1;
        # Upgrade/Connection are what let the dev server's HMR WebSocket through;
        # without them every edit falls back to a full page reload, or the client
        # reconnects in a loop.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── vhost 2: the API on its own name — http://backend.inkwell.ai ─────────────
#
# For Swagger, curl and Postman. The browser app does NOT use this origin — it
# calls /api on the frontend host — so no CORS surface is added by its existence.
server {
    listen 80;
    server_name backend.inkwell.ai;

    location / {
        set $upstream_api api:3000;
        proxy_pass http://$upstream_api;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }
}

# ── vhost 3: object storage — http://storage.inkwell.ai ──────────────────────
#
# This vhost is what makes image upload work. The backend hands the browser a
# presigned PUT URL built from MINIO_ENDPOINT:MINIO_PORT; pointed at the internal
# `minio:9000` no browser can resolve it, so uploads never left the page.
#
# Host must be forwarded untouched: a presigned S3 signature covers the Host
# header, so rewriting it here makes MinIO reject the PUT with 403
# SignatureDoesNotMatch.
server {
    listen 80;
    server_name storage.inkwell.ai;

    location / {
        set $upstream_minio minio:9000;
        proxy_pass http://$upstream_minio;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        # Stream the body straight through instead of buffering the whole upload
        # to disk first — MinIO handles chunked PUTs natively.
        proxy_request_buffering off;
    }
}
