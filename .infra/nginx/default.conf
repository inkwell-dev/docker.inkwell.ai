# Production reverse proxy. Development uses dev.conf instead.

upstream web {
    server web:3000;
}

upstream api {
    server api:3000;
}

# ── Port 80: ACME challenges, everything else redirected to HTTPS ────────────
#
# The compose file publishes 443 and mounts certificates, but nothing listened
# on it — so every https:// URL the app advertises (API base, presigned uploads,
# OAuth callback) was refused at the TCP level.
#
# REQUIRES two files in .infra/nginx/certs/ before starting in production:
#   fullchain.pem   privkey.pem
# nginx refuses to start without them. See README for the certbot command.
server {
    listen 80;
    server_name _;

    # Certbot's HTTP-01 challenge must stay on plain HTTP, above the redirect,
    # or renewals fail once the redirect is in place.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Port 443: the application ────────────────────────────────────────────────
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # API routes — backend already has /api global prefix, no rewrite needed
    location /api/ {
        proxy_pass http://api;
        # A recorded prompt for /api/ai/transcribe is multipart audio; nginx's
        # default cap is 1m, which rejects anything past about a minute of Opus
        # with its own HTML 413 before the API ever sees it. 12m sits just above
        # the API's own 10 MB cap, so the sentence the writer reads on an
        # over-long recording is the API's, not nginx's.
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support (streaming AI responses + notifications)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # MinIO object storage proxy — READ path for uploaded images.
    #
    # publicUrl from UploadsService is the relative `/storage/<bucket>/<key>`,
    # so images are served same-origin. The trailing slash on proxy_pass strips
    # the /storage/ prefix.
    location /storage/ {
        proxy_pass http://minio:9000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow large image uploads
        client_max_body_size 25m;
    }

    # All other routes → Next.js
    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Object storage on its own hostname — the upload WRITE path ───────────────
#
# Presigned PUT URLs are built from MINIO_ENDPOINT, and MinIO addresses objects
# as /<bucket>/<key>. On the apex domain that path would be swallowed by the
# Next.js catch-all above, so uploads need a hostname where `/` means MinIO.
# This mirrors storage.inkwell.ai in dev.conf — the dev name is unrelated to the
# production one below and is left alone deliberately; it resolves via /etc/hosts.
#
# Set MINIO_ENDPOINT=storage.inkwell-ai.me and MINIO_USE_SSL=true, point a DNS
# record at this host, and include the name in the certificate:
#   certbot certonly -d inkwell-ai.me -d www.inkwell-ai.me -d storage.inkwell-ai.me
#
# Host is forwarded verbatim because a presigned S3 signature covers it —
# rewriting it makes MinIO reject the PUT with 403 SignatureDoesNotMatch.
server {
    listen 443 ssl;
    http2 on;
    server_name storage.inkwell-ai.me;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 25m;
        # Stream the body through rather than buffering the whole upload to disk.
        proxy_request_buffering off;
    }
}
